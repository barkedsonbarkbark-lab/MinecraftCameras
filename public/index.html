<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MinecraftCameras</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>Public MinecraftCameras</h1>
          <p>Pick a shared world, then choose a camera inside it.</p>
        </div>
        <form id="worldLookup" class="lookup">
          <input id="worldIdInput" name="worldId" autocomplete="off" placeholder="Enter world ID">
          <button type="submit">Open</button>
        </form>
      </section>

      <nav class="nav-actions">
        <a href="/link">Link your world</a>
      </nav>

      <section id="publicWorlds" class="world-grid" aria-live="polite"></section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
