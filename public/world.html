<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MinecraftCameras World</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <a class="back-link" href="/">Back to public worlds</a>
          <h1 id="worldName">World</h1>
          <p id="worldMeta">Loading cameras...</p>
        </div>
        <form id="shareCodeForm" class="lookup">
          <input id="shareCodeInput" name="code" autocomplete="off" placeholder="Share code">
          <button type="submit">Unlock</button>
        </form>
      </section>

      <section class="world-actions">
        <button id="copyWorldLinkButton" type="button">Copy Link</button>
        <button id="refreshWorldButton" type="button">Refresh</button>
        <p id="ownerStatus" class="owner-status"></p>
      </section>

      <section class="viewer-layout">
        <aside id="cameraList" class="camera-list"></aside>
        <section class="viewer">
          <div class="pov-switch" role="group" aria-label="POV">
            <button id="cameraPovButton" class="selected" type="button">Camera POV</button>
            <button id="playerPovButton" type="button">Player POV</button>
          </div>
          <video id="liveVideo" playsinline controls muted></video>
          <img id="frame" alt="Selected camera frame">
          <div id="emptyState" class="empty-state">Select a camera to start watching.</div>
          <div id="viewerMeta" class="viewer-meta"></div>
        </section>
        <aside id="controlPanel" class="control-panel" hidden>
          <h2>Controls</h2>
          <label>
            <span>Yaw</span>
            <input id="yawInput" type="range" min="-180" max="180" step="1">
            <output id="yawValue"></output>
          </label>
          <label>
            <span>Pitch</span>
            <input id="pitchInput" type="range" min="-90" max="90" step="1">
            <output id="pitchValue"></output>
          </label>
          <label>
            <span>FOV</span>
            <input id="fovInput" type="range" min="30" max="110" step="1">
            <output id="fovValue"></output>
          </label>
          <button id="sendControlButton" type="button">Send</button>
          <p id="controlStatus"></p>
        </aside>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/world.js" type="module"></script>
  </body>
</html>
