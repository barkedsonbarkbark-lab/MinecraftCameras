<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minecraft Camera World</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <a class="back-link" href="/">Back to public cameras</a>
          <h1 id="worldName">World</h1>
          <p id="worldMeta">Loading cameras...</p>
        </div>
        <form id="shareCodeForm" class="lookup">
          <input id="shareCodeInput" name="code" autocomplete="off" placeholder="Share code">
          <button type="submit">Unlock</button>
        </form>
      </section>

      <section class="viewer-layout">
        <aside id="cameraList" class="camera-list"></aside>
        <section class="viewer">
          <img id="frame" alt="Selected camera frame">
          <div id="emptyState" class="empty-state">Select a camera to start watching.</div>
          <div id="viewerMeta" class="viewer-meta"></div>
        </section>
      </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/world.js" type="module"></script>
  </body>
</html>
